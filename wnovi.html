<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novi MI Dashboard</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: white;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 12px;
  box-sizing: border-box;
}

.card {
  background: #ededed;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
  margin-bottom: 12px;
}

.date {
  font-size: 2rem;
}

.clock {
  font-size: 3.6rem;
}

.icon {
  font-size: 4.5rem;
}

.temp {
  font-size: 8rem;
  font-weight: 600;
}

.hilo {
  font-size: 2.2rem;
  opacity: .7;
}

.travel {
  margin-top: 8px;
  font-size: 1.15rem;
  color: #1a73e8;
}

.clock-wrap {
  text-align: center;
}


/* =========================================================
   ROEPER BUTTON
   ========================================================= */

.roeper-button-cell {
  text-align: center;
  vertical-align: middle;
}

.roeper-button {
  font-size: 1.35rem;
  font-weight: 600;
  padding: 18px 28px;
  border: none;
  border-radius: 18px;
  background: #4285f4;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,.18);
  white-space: nowrap;
}

.roeper-button:hover {
  background: #3367d6;
}

.roeper-button:active {
  transform: scale(.98);
}


/* =========================================================
   QUOTE OF THE DAY
   ========================================================= */

.quote-box {
  margin-top: 8px;
  text-align: center;
  max-width: 300px;
  margin-left: auto;
  margin-right: auto;
}

.quote-text {
  font-size: .85rem;
  line-height: 1.2;
  font-style: italic;
  opacity: .72;
}

.quote-author {
  font-size: .72rem;
  line-height: 1.15;
  margin-top: 2px;
  opacity: .55;
}

.quote-source {
  font-size: .58rem;
  line-height: 1;
  margin-top: 2px;
  opacity: .4;
}


/* =========================================================
   SECTIONS
   ========================================================= */

.section {
  margin-top: 16px;
}

.section-title {
  font-size: 1.6rem;
  margin-bottom: 8px;
}


/* =========================================================
   HOURLY WEATHER
   ========================================================= */

.hourly-header {
  position: relative;
  height: 42px;
  margin-bottom: 10px;
}

.hourly-title {
  font-size: 1.6rem;
  position: absolute;
  left: 0;
  top: 0;
}

.hourly-day {
  font-size: 1.6rem;
  font-weight: 600;
  text-align: center;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 0;
}

.hourly-nav {
  position: absolute;
  right: 0;
  top: 0;
  display: flex;
  gap: 8px;
}

.hourly-nav button {
  width: 70px;
  height: 42px;
  font-size: 2rem;
  line-height: 1;
  border: none;
  border-radius: 10px;
  background: white;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
}

.hourly-nav button:hover {
  background: #f5f5f5;
}

.hourly-nav button:disabled {
  opacity: .35;
  cursor: default;
}

.hourly {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.hour {
  flex: 1;
  min-width: 0;
  text-align: center;
  font-size: 1.3rem;
  padding: 10px 5px;
  border-radius: 14px;
  box-sizing: border-box;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  transition: background .3s ease, color .3s ease;
}

.hour.sunny-day {
  background: linear-gradient(to bottom,#fff6a8 0%,#dff4ff 100%);
}

.hour.partly-cloudy-day {
  background: linear-gradient(to bottom,#dceeff 0%,#e8e8e8 100%);
}

.hour.cloudy-day {
  background: linear-gradient(to bottom,#d5d8dc 0%,#bfc3c7 100%);
}

.hour.rainy-day {
  background: linear-gradient(to bottom,#c3d2df 0%,#9aaab8 100%);
}

.hour.snowy-day {
  background: linear-gradient(to bottom,#eef7ff 0%,#d5e2ec 100%);
}

.hour.stormy-day {
  background: linear-gradient(to bottom,#999da3 0%,#686d73 100%);
  color: white;
}

.hour.sunny-night {
  background: linear-gradient(to bottom,#394867 0%,#1d2940 100%);
  color: white;
}

.hour.partly-cloudy-night {
  background: linear-gradient(to bottom,#454f62 0%,#252d3b 100%);
  color: white;
}

.hour.cloudy-night {
  background: linear-gradient(to bottom,#4b4f55 0%,#2d3035 100%);
  color: white;
}

.hour.rainy-night {
  background: linear-gradient(to bottom,#3f5366 0%,#263440 100%);
  color: white;
}

.hour.snowy-night {
  background: linear-gradient(to bottom,#4e6070 0%,#303e49 100%);
  color: white;
}

.hour.stormy-night {
  background: linear-gradient(to bottom,#3a3b40 0%,#202125 100%);
  color: white;
}


/* =========================================================
   DAILY FORECAST
   ========================================================= */

.daily {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.day {
  text-align: center;
  font-size: 1.3rem;
  flex: 1;
  min-width: 0;
  padding: 14px 8px;
  border-radius: 16px;
  box-sizing: border-box;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  transition: background .3s ease;
}

.day-date {
  font-weight: 600;
  margin-bottom: 8px;
}

.day-icon {
  font-size: 2.8rem;
  margin: 6px 0;
}

.day-temp {
  font-size: 1.25rem;
  font-weight: 500;
}

.day.sunny {
  background: linear-gradient(to bottom,#fff7b2 0%,#dff4ff 100%);
}

.day.partly-cloudy {
  background: linear-gradient(to bottom,#dceeff 0%,#e8e8e8 100%);
}

.day.cloudy {
  background: linear-gradient(to bottom,#d5d8dc 0%,#bfc3c7 100%);
}

.day.rainy {
  background: linear-gradient(to bottom,#b9c9d8 0%,#8f9eab 100%);
}

.day.snowy {
  background: linear-gradient(to bottom,#eef7ff 0%,#d5e2ec 100%);
}

.day.stormy {
  background: linear-gradient(to bottom,#8e9298 0%,#5f646b 100%);
  color: white;
}


/* =========================================================
   UPDATED / FOOTER
   ========================================================= */

.updated {
  margin-top: 12px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 1rem;
  opacity: .7;
}

.quote {
  font-style: italic;
}

footer {
  margin-top: auto;
  text-align: center;
  opacity: .5;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1100px) {

  .temp {
    font-size: 6rem;
  }

  .date {
    font-size: 1.6rem;
  }

  .clock {
    font-size: 3rem;
  }

  .hilo {
    font-size: 1.7rem;
  }

  .roeper-button {
    font-size: 1.1rem;
    padding: 15px 20px;
  }

  .daily {
    gap: 6px;
  }

  .day {
    font-size: 1.05rem;
    padding: 10px 5px;
  }
}

@media (max-width: 800px) {

  .hourly {
    gap: 5px;
  }

  .hour {
    font-size: 1rem;
  }

  .hourly-nav button {
    width: 55px;
  }

  .roeper-button {
    font-size: 1rem;
    padding: 13px 15px;
  }

  .quote-box {
    max-width: 220px;
  }

  .quote-text {
    font-size: .75rem;
  }

}
</style>
</head>

<body>

<div class="container">


<!-- =====================================================
     SECTION 1 - CURRENT WEATHER
     ===================================================== -->

<div class="card section">

<table width="100%">

<tr>

<td width="10%">
  <div class="icon" id="icon">☀️</div>
</td>

<td width="15%">
  <div class="temp" id="temp">--°</div>
</td>

<td width="20%">

  <div class="hilo">

    <table width="100%">

      <tr>
        <td align="right">
          <div>High:</div>
        </td>

        <td align="left">
          <span id="high">--°</span>
        </td>
      </tr>

      <tr>
        <td align="right">
          <div>Low:</div>
        </td>

        <td align="left">
          <span id="low">--°</span>
        </td>
      </tr>

    </table>

  </div>

</td>

<td width="25%" class="roeper-button-cell">

  <button
    class="roeper-button"
    onclick="showRoeperMap()">

    Show time to Roepar

  </button>

  <!-- QUOTE IS INSIDE THE SAME TABLE CELL -->
  <div class="quote-box">

    <div
      class="quote-text"
      id="quoteText">

      class="quote-author"

    </div>

  </div>

</td>

<td width="30%">

  <div class="clock-wrap">

      class="date"
      id="date">
    </div>

      class="clock"
      id="clock">
    </div>

</td>

</tr>

</table>

<div class="updated">

<!-- =====================================================
     SECTION 2 - NEXT 12 HOURS
     ===================================================== -->

<div class="section">

  <div class="hourly-header">

    <div class="hourly-title">
      Next 12 Hours
    </div>

    <div
      class="hourly-day"
      id="hourlyDay">
      —
    </div>

    <div class="hourly-nav">

      <button
        id="hourlyBack"
        aria-label="Previous 12 hours">
        ‹
      </button>

      <button
        id="hourlyForward"
        aria-label="Next 12 hours">
        ›
      </button>

    </div>

  </div>

  <div
    class="hourly"
    id="hourly">
  </div>

</div>


<!-- =====================================================
     SECTION 3 - 8 DAY FORECAST
     ===================================================== -->

<div class="section">

  <div class="section-title">
    8-Day Forecast
  </div>

  <div
    class="daily"
    id="daily">
  </div>

</div>


<footer>
  Novi, Michigan
</footer>

</div>


<script>


/* =========================================================
   LOCATION
   ========================================================= */

const LAT = 42.4806;
const LON = -83.4755;


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock(){

  const now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

}

setInterval(updateClock, 1000);

updateClock();


/* =========================================================
   WEATHER ICONS
   ========================================================= */

function weatherIcon(code){

  const icons = {
    0:"☀️",
    1:"🌤️",
    2:"⛅",
    3:"☁️",
    45:"🌫️",
    48:"🌫️",
    51:"🌦️",
    53:"🌦️",
    55:"🌧️",
    56:"🌧️",
    57:"🌧️",
    61:"🌧️",
    63:"🌧️",
    65:"🌧️",
    66:"🌧️",
    67:"🌧️",
    71:"🌨️",
    73:"❄️",
    75:"❄️",
    77:"❄️",
    80:"🌦️",
    81:"🌧️",
    82:"🌧️",
    85:"🌨️",
    86:"❄️",
    95:"⛈️",
    96:"⛈️",
    99:"⛈️"
  };

  return icons[Number(code)] ?? "🌡️";
}


/* =========================================================
   HOURLY WEATHER CLASS
   ========================================================= */

function getHourlyWeatherClass(code){

  code = Number(code);

  if(code === 0)
    return "sunny";

  if(code === 1 || code === 2)
    return "partly-cloudy";

  if(code === 3 || code === 45 || code === 48)
    return "cloudy";

  if(
    (code >= 51 && code <= 67) ||
    (code >= 80 && code <= 82)
  )
    return "rainy";

  if(
    (code >= 71 && code <= 77) ||
    (code >= 85 && code <= 86)
  )
    return "snowy";

  if(code >= 95)
    return "stormy";

  return "cloudy";
}


/* =========================================================
   HOURLY DATA
   ========================================================= */

let hourlyPageOffset = 0;
let hourlyData = null;


/* =========================================================
   RENDER HOURLY
   ========================================================= */

function renderHourly(){

  const hourly =
    document.getElementById("hourly");

  const dayLabel =
    document.getElementById("hourlyDay");

  const backButton =
    document.getElementById("hourlyBack");

  const forwardButton =
    document.getElementById("hourlyForward");

  hourly.innerHTML = "";


  if(
    !hourlyData ||
    !hourlyData.time ||
    hourlyData.time.length === 0
  ){

    dayLabel.textContent = "—";
    backButton.disabled = true;
    forwardButton.disabled = true;

    return;
  }


  const now = new Date();


  let firstFutureIndex =
    hourlyData.time.findIndex(
      time => new Date(time) >= now
    );


  if(firstFutureIndex < 0)
    firstFutureIndex =
      hourlyData.time.length - 1;


  const startIndex =
    Math.min(
      firstFutureIndex + hourlyPageOffset,
      Math.max(
        0,
        hourlyData.time.length - 1
      )
    );


  const endIndex =
    Math.min(
      startIndex + 12,
      hourlyData.time.length
    );


  const [
    year,
    month,
    day
  ] =
    hourlyData.time[startIndex]
      .slice(0,10)
      .split("-")
      .map(Number);


  const displayDate =
    new Date(
      year,
      month - 1,
      day
    );


  dayLabel.textContent =
    displayDate.toLocaleDateString(
      [],
      {
        weekday:"long"
      }
    );


  for(
    let i = startIndex;
    i < endIndex;
    i++
  ){

    const t =
      new Date(
        hourlyData.time[i]
      );

    const code =
      Number(
        hourlyData.weathercode[i]
      );


    let sunrise = null;
    let sunset = null;


    if(
      hourlyData.daily &&
      hourlyData.daily.time
    ){

      const dateString =
        hourlyData.time[i].slice(0,10);

      const dailyIndex =
        hourlyData.daily.time.indexOf(
          dateString
        );


      if(dailyIndex >= 0){

        sunrise =
          new Date(
            hourlyData.daily.sunrise[
              dailyIndex
            ]
          );

        sunset =
          new Date(
            hourlyData.daily.sunset[
              dailyIndex
            ]
          );

      }
    }


    let isDaytime = true;


    if(sunrise && sunset){

      isDaytime =
        t >= sunrise &&
        t < sunset;

    }


    const weatherClass =
      getHourlyWeatherClass(code);


    const timeClass =
      isDaytime
        ? `${weatherClass}-day`
        : `${weatherClass}-night`;


    hourly.innerHTML += `

      <div class="hour ${timeClass}">

        <div>
          ${t.toLocaleTimeString(
            [],
            {
              hour:"numeric"
            }
          )}
        </div>

        <div
          style="
            font-size:2.4rem;
            margin:5px 0;
          ">

          ${weatherIcon(code)}

        </div>

        <div>
          ${Math.round(
            hourlyData.temperature_2m[i]
          )}°
        </div>

      </div>

    `;
  }


  backButton.disabled =
    hourlyPageOffset <= 0;

  forwardButton.disabled =
    endIndex >= hourlyData.time.length;
}


/* =========================================================
   HOURLY BACK
   ========================================================= */

document
  .getElementById("hourlyBack")
  .addEventListener(
    "click",
    () => {

      hourlyPageOffset =
        Math.max(
          0,
          hourlyPageOffset - 12
        );

      renderHourly();

    }
  );


/* =========================================================
   HOURLY FORWARD
   ========================================================= */

document
  .getElementById("hourlyForward")
  .addEventListener(
    "click",
    () => {

      if(
        hourlyData &&
        hourlyPageOffset + 12 <
          hourlyData.time.length
      ){

        hourlyPageOffset += 12;

        renderHourly();

      }
    }
  );


/* =========================================================
   DAILY WEATHER CLASS
   ========================================================= */

function getWeatherClass(code){

  code = Number(code);

  if(code === 0)
    return "sunny";

  if(code === 1 || code === 2)
    return "partly-cloudy";

  if(code === 3 || code === 45 || code === 48)
    return "cloudy";

  if(
    (code >= 51 && code <= 67) ||
    (code >= 80 && code <= 82)
  )
    return "rainy";

  if(
    (code >= 71 && code <= 77) ||
    (code >= 85 && code <= 86)
  )
    return "snowy";

  if(code >= 95)
    return "stormy";

  return "cloudy";
}


/* =========================================================
   LOAD WEATHER
   ========================================================= */

async function loadWeather(){

  try{

    const url =
      `https://api.open-meteo.com/v1/forecast?` +
      `latitude=${LAT}` +
      `&longitude=${LON}` +
      `&current_weather=true` +
      `&hourly=temperature_2m,weathercode` +
      `&daily=temperature_2m_max,temperature_2m_min,weathercode,sunrise,sunset` +
      `&temperature_unit=fahrenheit` +
      `&timezone=auto`;


    const response =
      await fetch(url);


    if(!response.ok)
      throw new Error(
        "Weather service unavailable"
      );


    const d =
      await response.json();


    /* CURRENT WEATHER */

    document.getElementById("temp").textContent =
      Math.round(
        d.current_weather.temperature
      ) + "°";


    document.getElementById("icon").textContent =
      weatherIcon(
        d.current_weather.weathercode
      );


    document.getElementById("high").textContent =
      Math.round(
        d.daily.temperature_2m_max[0]
      ) + "°";


    document.getElementById("low").textContent =
      Math.round(
        d.daily.temperature_2m_min[0]
      ) + "°";


    /* HOURLY */

    hourlyData =
      d.hourly;

    hourlyData.daily =
      d.daily;

    hourlyPageOffset = 0;

    renderHourly();


    /* UPDATED */

    document.getElementById("updated").textContent =
      "Last updated: " +
      new Date().toLocaleTimeString(
        [],
        {
          hour:"numeric",
          minute:"2-digit"
        }
      );


    /* DAILY */

    const daily =
      document.getElementById("daily");

    daily.innerHTML = "";


    for(let i = 1; i <= 8; i++){

      const [
        year,
        month,
        day
      ] =
        d.daily.time[i]
          .split("-")
          .map(Number);


      const dt =
        new Date(
          year,
          month - 1,
          day
        );


      const code =
        Number(
          d.daily.weathercode[i]
        );


      const weatherClass =
        getWeatherClass(code);


      const sunrise =
        new Date(
          d.daily.sunrise[i]
        );


      const sunset =
        new Date(
          d.daily.sunset[i]
        );


      const sunriseText =
        sunrise.toLocaleTimeString(
          [],
          {
            hour:"numeric",
            minute:"2-digit"
          }
        );


      const sunsetText =
        sunset.toLocaleTimeString(
          [],
          {
            hour:"numeric",
            minute:"2-digit"
          }
        );


      daily.innerHTML += `

        <div
          class="day ${weatherClass}"
          title="Sunrise: ${sunriseText} | Sunset: ${sunsetText}">

          <div class="day-date">

            ${dt.toLocaleDateString(
              [],
              {
                weekday:"short",
                month:"numeric",
                day:"numeric"
              }
            )}

          </div>

          <div class="day-icon">
            ${weatherIcon(code)}
          </div>

          <div class="day-temp">

            ${Math.round(
              d.daily.temperature_2m_max[i]
            )}°

            /

            ${Math.round(
              d.daily.temperature_2m_min[i]
            )}°

          </div>

          <div
            style="
              font-size:.8rem;
              opacity:.65;
              margin-top:6px;
            ">

            ☀️ ${sunriseText}<br>
            🌙 ${sunsetText}

          </div>

        </div>

      `;
    }

  }
  catch(error){

    console.error(
      "Weather error:",
      error
    );

    document.getElementById(
      "updated"
    ).textContent =
      "Weather unavailable";

  }
}


/* =========================================================
   WEATHER START
   ========================================================= */

loadWeather();

setInterval(
  loadWeather,
  300000
);


/* =========================================================
   QUOTE SYSTEM
   =========================================================

   The quote system is deliberately isolated
   from the weather code so a quote API failure
   can never stop Sections 2 or 3 from rendering.
   ========================================================= */

const backupQuotes = [

  {
    quote:"The best way to predict the future is to create it.",
    author:"Peter Drucker"
  },

  {
    quote:"It always seems impossible until it's done.",
    author:"Nelson Mandela"
  },

  {
    quote:"The future depends on what you do today.",
    author:"Mahatma Gandhi"
  },

  {
    quote:"What we think, we become.",
    author:"Buddha"
  },

  {
    quote:"Do what you can, with what you have, where you are.",
    author:"Theodore Roosevelt"
  },

  {
    quote:"Believe you can and you're halfway there.",
    author:"Theodore Roosevelt"
  },

  {
    quote:"Great things are done by a series of small things brought together.",
    author:"Vincent van Gogh"
  },

  {
    quote:"A journey of a thousand miles begins with a single step.",
    author:"Lao Tzu"
  },

  {
    quote:"Success is the sum of small efforts, repeated day in and day out.",
    author:"Robert Collier"
  }

];


function displayQuote(
  quote,
  author,
  source
){

  document.getElementById(
    "quoteText"
  ).textContent =
    `"${quote}"`;

  document.getElementById(
    "quoteAuthor"
  ).textContent =
    `— ${author}`;

  document.getElementById(
    "quoteSource"
  ).textContent =
    source;

}


/* =========================================================
   SOURCE 1 - DUMMYJSON
   ========================================================= */

async function getDummyJsonQuote(){

  const response =
    await fetch(
      "https://dummyjson.com/quotes/random",
      {
        cache:"no-store"
      }
    );


  if(!response.ok)
    throw new Error(
      "DummyJSON unavailable"
    );


  const data =
    await response.json();


  if(
    !data.quote ||
    !data.author
  )
    throw new Error(
      "Invalid DummyJSON quote"
    );


  return {
    quote:data.quote,
    author:data.author,
    source:"DummyJSON"
  };

}


/* =========================================================
   SOURCE 2 - ZENQUOTES
   ========================================================= */

async function getZenQuote(){

  const response =
    await fetch(
      "https://zenquotes.io/api/random",
      {
        cache:"no-store"
      }
    );


  if(!response.ok)
    throw new Error(
      "ZenQuotes unavailable"
    );


  const data =
    await response.json();


  if(
    !Array.isArray(data) ||
    !data.length ||
    !data[0].q ||
    !data[0].a
  )
    throw new Error(
      "Invalid ZenQuotes response"
    );


  return {
    quote:data[0].q,
    author:data[0].a,
    source:"ZenQuotes"
  };

}


/* =========================================================
   LOAD QUOTE
   ========================================================= */

async function loadQuote(){

  /*
   * Randomly choose which online source
   * to try first.
   */

  const useZenFirst =
    Math.random() < 0.5;


  const sources =
    useZenFirst
      ? [
          getZenQuote,
          getDummyJsonQuote
        ]
      : [
          getDummyJsonQuote,
          getZenQuote
        ];


  for(
    const source of sources
  ){

    try{

      const result =
        await source();


      displayQuote(
        result.quote,
        result.author,
        "Source: " + result.source
      );

      return;

    }
    catch(error){

      console.log(
        "Quote source failed:",
        error
      );

    }

  }


  /*
   * Both online sources failed.
   * Use a local quote instead.
   */

  const backup =
    backupQuotes[
      Math.floor(
        Math.random() *
        backupQuotes.length
      )
    ];


  displayQuote(
    backup.quote,
    backup.author,
    "Source: Dashboard backup"
  );

}


/* =========================================================
   INITIAL QUOTE
   ========================================================= */

loadQuote();


/* =========================================================
   REFRESH QUOTE EVERY HOUR
   ========================================================= */

setInterval(
  loadQuote,
  60 * 60 * 1000
);
