<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Novi MI Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin:0;
  height:100%;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:white;
}
.container{
  display:flex;
  flex-direction:column;
  height:100%;
  padding:12px;
  box-sizing:border-box;
}
.card{
  background:#ededed;
  border-radius:18px;
  padding:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
  margin-bottom:12px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.city{
  font-size:2.5rem;
  font-weight:600;
}
.clock-wrap{
  text-align:right;
}
.date{font-size:2rem;}
.clock{font-size:3.6rem;}
.current{
  display:flex;
  align-items:center;
  gap:24px;
  margin-top:16px;
}
.icon{font-size:4.5rem;}
.temp{font-size:8rem;font-weight:600;}
.hilo{font-size:2.2rem;opacity:.7;}
.travel{
  margin-top:8px;
  font-size:1.15rem;
  color:#1a73e8;
}
.section{
  margin-top:16px;
}
.section-title{
  font-size:1.6rem;
  margin-bottom:8px;
}
.hourly,.daily{
  display:flex;
  justify-content:space-between;
}
.hour,.day{
  text-align:center;
  font-size:1.3rem;
}
.day-date{font-weight:600;}
.updated{
  margin-top:12px;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:1rem;
  opacity:.7;
}
.quote{font-style:italic;}
footer{
  margin-top:auto;
  text-align:center;
  opacity:.5;
}
</style>
</head>

<body>
<div  class="container">

  <!-- CURRENT WEATHER CARD -->

    <div class="card section"  >
<table width=100% >
<tr>
<td width=10% >
      <div  class="icon" id="icon">☀️</div>
</td>
<td width=15% >
      <div  class="temp" id="temp">--°</div>
</td>
<td width=20% >
      <div  class="hilo">

		<table width=100% >
		<tr>
			<td align=right><div>High: </div></td>
			<td align=left><span id="high">--°</span></td>
		</tr>
		<tr>
			<td align=right><div>Low: </div></td>
			<td align=left><span id="low">--°</span></td>
		</tr>
		</table>



      </div>
</td>

<td width=30% align=center >

<table width=80% >
		<tr>
			<td align=right>    <div class="travel" id="travel"></div></td>
		</tr>
		<tr>
			<td align=right>&nbsp;</td>
		</tr>
		<tr>
			<td align=right>      <span class="quote" id="quote"></span></td>
		</tr>
		</table>
</td>


<td width=30% >
      <div  class="clock-wrap">
        <div  class="date" id="date"></div>
        <div  class="clock" id="clock"></div>
      </div>

</td>
</table>
<div  class="updated"><span id="updated"></span></div>
  </div>
    

      


  <!-- HOURLY FORECAST -->
  <div  class="card section" id="dx">
    <div class="hourly-header">
      <div class="hourly-title">Next 12 Hours</div>
      <div class="hourly-day" id="hourlyDay">—</div>
      <div class="hourly-nav">
        <button id="hourlyBack" type="button" aria-label="Previous 12 hours" title="Previous 12 hours">‹</button>
        <button id="hourlyForward" type="button" aria-label="Next 12 hours" title="Next 12 hours">›</button>
      </div>
    </div>
    <div class="hourly" id="hourly"></div>
  </div>

  <!-- DAILY FORECAST -->
  <div  class="card section">
    <div  class="section-title">8-Day Forecast</div>
    <div  class="daily" id="daily"></div>
  </div>

</div>

<script>
const LAT = 42.4806;
const LON = -83.4755;

/* CLOCK */
function updateClock(){
  const now = new Date();
  document.getElementById("date").textContent =
    now.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric",year:"numeric"});
  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();

/* WEATHER ICONS
   Open-Meteo uses WMO weather interpretation codes.
   Map each code explicitly so fog, drizzle, snow, showers, and
   thunderstorms don't get grouped under the wrong icon.
*/
function weatherIcon(code){
  const icons = {
    0: "☀️",   // Clear sky
    1: "🌤️",   // Mainly clear
    2: "⛅",   // Partly cloudy
    3: "☁️",   // Overcast
    45: "🌫️",  // Fog
    48: "🌫️",  // Depositing rime fog
    51: "🌦️",  // Light drizzle
    53: "🌦️",  // Moderate drizzle
    55: "🌧️",  // Dense drizzle
    56: "🌧️",  // Light freezing drizzle
    57: "🌧️",  // Dense freezing drizzle
    61: "🌧️",  // Slight rain
    63: "🌧️",  // Moderate rain
    65: "🌧️",  // Heavy rain
    66: "🌧️",  // Light freezing rain
    67: "🌧️",  // Heavy freezing rain
    71: "🌨️",  // Slight snow
    73: "❄️",   // Moderate snow
    75: "❄️",   // Heavy snow
    77: "❄️",   // Snow grains
    80: "🌦️",  // Slight rain showers
    81: "🌧️",  // Moderate rain showers
    82: "🌧️",  // Violent rain showers
    85: "🌨️",  // Slight snow showers
    86: "❄️",   // Heavy snow showers
    95: "⛈️",  // Thunderstorm
    96: "⛈️",  // Thunderstorm with slight hail
    99: "⛈️"   // Thunderstorm with heavy hail
  };
  return icons[Number(code)] ?? "🌡️";
}

/* HOURLY FORECAST NAVIGATION */
let hourlyPageOffset = 0;
let hourlyData = null;

function renderHourly(){
  const hourly = document.getElementById("hourly");
  const dayLabel = document.getElementById("hourlyDay");
  const backButton = document.getElementById("hourlyBack");
  const forwardButton = document.getElementById("hourlyForward");

  hourly.innerHTML = "";
  if(!hourlyData || !hourlyData.time || hourlyData.time.length === 0){
    dayLabel.textContent = "—";
    backButton.disabled = true;
    forwardButton.disabled = true;
    return;
  }

  const now = new Date();
  let firstFutureIndex = hourlyData.time.findIndex(time => new Date(time) >= now);
  if(firstFutureIndex < 0) firstFutureIndex = hourlyData.time.length - 1;

  const startIndex = Math.min(
    firstFutureIndex + hourlyPageOffset,
    Math.max(0, hourlyData.time.length - 1)
  );
  const endIndex = Math.min(startIndex + 12, hourlyData.time.length);
  const [year, month, day] = hourlyData.time[startIndex].slice(0, 10).split("-").map(Number);
  const displayDate = new Date(year, month - 1, day);
  dayLabel.textContent = displayDate.toLocaleDateString([], {weekday:"long"});

  for(let i = startIndex; i < endIndex; i++){
    const t = new Date(hourlyData.time[i]);
    hourly.innerHTML += `
      <div class="hour">
        <div>${t.toLocaleTimeString([], {hour:"numeric"})}</div>
        <div>${weatherIcon(hourlyData.weathercode[i])}</div>
        <div>${Math.round(hourlyData.temperature_2m[i])}°</div>
      </div>`;
  }

  backButton.disabled = hourlyPageOffset <= 0;
  forwardButton.disabled = endIndex >= hourlyData.time.length;
}

document.getElementById("hourlyBack").addEventListener("click", () => {
  hourlyPageOffset = Math.max(0, hourlyPageOffset - 12);
  renderHourly();
});
document.getElementById("hourlyForward").addEventListener("click", () => {
  if(hourlyData && hourlyPageOffset + 12 < hourlyData.time.length){
    hourlyPageOffset += 12;
    renderHourly();
  }
});

/* LOAD WEATHER */
async function loadWeather(){
  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
    `&current_weather=true&hourly=temperature_2m,weathercode`+
    `&daily=temperature_2m_max,temperature_2m_min,weathercode`+
    `&temperature_unit=fahrenheit&timezone=auto`;

  const d = await (await fetch(url)).json();

  document.getElementById("temp").textContent = Math.round(d.current_weather.temperature)+"°";
  document.getElementById("icon").textContent = weatherIcon(d.current_weather.weathercode);
  document.getElementById("high").textContent = Math.round(d.daily.temperature_2m_max[0])+"°";
  document.getElementById("low").textContent = Math.round(d.daily.temperature_2m_min[0])+"°";

  // Keep the selected 12-hour page, but refresh its data and weekday label.
  hourlyData = d.hourly;
  renderHourly();

  document.getElementById("updated").textContent =
    "Last updated: "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});


// 8-day forecast starting from tomorrow

const daily = document.getElementById("daily");
daily.innerHTML = "";
for (let i = 1; i <= 8; i++) { // skip today
  const [year, month, day] = d.daily.time[i].split("-").map(Number);
  const dt = new Date(year, month - 1, day); // correct local date
  daily.innerHTML += `
    <div class="day">
      <div class="day-date">
        ${dt.toLocaleDateString([], { weekday: "short", month: "numeric", day: "numeric" })}
      </div>
      <div>${weatherIcon(d.daily.weathercode[i])}</div>
      <div>${Math.round(d.daily.temperature_2m_max[i])}° /
           ${Math.round(d.daily.temperature_2m_min[i])}°</div>
    </div>`;

}

}
loadWeather();
setInterval(loadWeather,300000);

/* LOAD QUOTE */
async function loadQuote(){
  try{
    const r = await fetch(
      "https://api.allorigins.win/raw?url="+
      encodeURIComponent("https://zenquotes.io/api/today")
    );
    const d = await r.json();
    document.getElementById("quote").textContent = `"${d[0].q}" — ${d[0].a}`;
  }catch{
    document.getElementById("quote").textContent = "Stay present. Stay kind.";
  }
}
//loadQuote();

/* SCHOOL TRAVEL TIME USING MAPBOX (6 AM - 8 AM ONLY) */
const mapboxKey = "pk.eyJ1Ijoic3Rncm91cCIsImEiOiJjbWp4ZXE1cmE1a3VyM2dxMWVma2tkempzIn0.w225FCxMloOE30u-aghOmw"; // replace with your Mapbox token
const origin = [-83.4755,42.4806]; // Novi
const destination = [-83.2205,42.5536]; // Roeper School

async function loadTravelTime(){
  const now = new Date();
  const hour = now.getHours();
  const travelEl = document.getElementById("travel");

  if(hour >= 6 && hour < 8){
    // Only show travel time between 6AM and 8AM
    try{
      const url = `https://api.mapbox.com/directions/v5/mapbox/driving/`+
                  `${origin[0]},${origin[1]};${destination[0]},${destination[1]}`+
                  `?access_token=${mapboxKey}`;
      const r = await fetch(url);
      const d = await r.json();
      const minutes = Math.round(d.routes[0].duration / 60);
      travelEl.textContent = `🚗 Estimated drive: ~${minutes} min`;
    }catch{
      travelEl.textContent = "🚗 Travel time unavailable";
    }
  } else {
    travelEl.textContent = "🚗 Travel time to Avleen school will be displayed only between 6 AM and 8 AM";
  }
}

// Initial load + interval every 10 minutes
//loadTravelTime();
//setInterval(loadTravelTime, 600000); // 600,000ms = 10 minutes
</script>
</body>
</html>
