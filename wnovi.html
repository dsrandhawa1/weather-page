<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novi MI Dashboard</title>

<style>
:root {
  --padspace: 2px;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: white;
}

.container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: calc(12px - var(--padspace));
  box-sizing: border-box;
}

.card {
  background: #ededed;
  border-radius: 18px;
  padding: calc(16px - var(--padspace));
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
  margin-bottom: calc(12px - var(--padspace));
}

.date { font-size: 2rem; }
.clock { font-size: 3.6rem; }
.icon { font-size: 4.5rem; }
.temp { font-size: 8rem; font-weight: 600; }
.hilo { font-size: 2.2rem; opacity: .7; }
.clock-wrap { text-align: center; }

.roeper-button-cell {
  text-align: center;
  vertical-align: middle;
}

.roeper-button {
  font-size: 1.35rem;
  font-weight: 600;
  padding: calc(18px - var(--padspace)) calc(28px - var(--padspace));
  border: none;
  border-radius: 18px;
  background: #4285f4;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,.18);
  white-space: nowrap;
}

.roeper-button:hover { background: #3367d6; }
.roeper-button:active { transform: scale(.98); }

.drive-box {
  margin-top: calc(8px - var(--padspace));
  text-align: center;
  max-width: 300px;
  margin-left: auto;
  margin-right: auto;
}

.drive-label {
  font-size: 1.1rem;
  opacity: .65;
}

.drive-time {
  font-size: 2.6rem;
  font-weight: 600;
  line-height: 1.1;
}

.drive-time.drive-good { color: #1b7a34; }
.drive-time.drive-slow { color: #a35f00; }
.drive-time.drive-bad { color: #c62828; }

.drive-detail {
  font-size: 1rem;
  line-height: 1.2;
  opacity: .75;
}

.drive-refresh {
  font-size: .95rem;
  line-height: 1.2;
  margin-top: 2px;
  opacity: .7;
}

.drive-note {
  font-size: .62rem;
  line-height: 1.1;
  margin-top: 2px;
  opacity: .45;
}

.section { margin-top: calc(16px - var(--padspace)); }

.section-title {
  font-size: 1.6rem;
  margin-bottom: calc(8px - var(--padspace));
}

/* HOURLY FORECAST */

.hourly-header {
  position: relative;
  height: 42px;
  margin-bottom: calc(10px - var(--padspace));
}

.hourly-title {
  font-size: 1.6rem;
  position: absolute;
  left: 0;
  top: 0;
}

.hourly-day {
  font-size: 1.6rem;
  font-weight: 600;
  text-align: center;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 0;
}

.hourly-nav {
  position: absolute;
  right: 0;
  top: 0;
  display: flex;
  gap: 8px;
}

.hourly-nav button {
  width: 70px;
  height: 42px;
  font-size: 2rem;
  line-height: 1;
  border: none;
  border-radius: 10px;
  background: white;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
}

.hourly-nav button:hover { background: #f5f5f5; }
.hourly-nav button:disabled { opacity: .35; cursor: default; }

.hourly {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.hour {
  flex: 1;
  min-width: 0;
  text-align: center;
  font-size: 1.3rem;
  padding: calc(10px - var(--padspace)) calc(5px - var(--padspace));
  border-radius: 14px;
  box-sizing: border-box;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  transition: background .3s ease, color .3s ease;
}

.hour-icon {
  font-size: 2.4rem;
  margin: 5px 0;
  min-height: 2.9rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hour-condition {
  font-size: .82rem;
  line-height: 1.1;
  min-height: 2em;
  margin-bottom: 5px;
}

/* NIGHT CLEAR-SKY STARS */

.night-stars {
  position: relative;
  width: 52px;
  height: 52px;
  margin: 0 auto;
}

.night-star {
  position: absolute;
  color: white;
  font-weight: bold;
  line-height: 1;
  text-shadow: 0 0 3px white, 0 0 7px white, 0 0 12px rgba(255,255,255,.8);
  animation: twinkle 1.8s infinite ease-in-out;
}

.night-star-1 { top: 3px; left: 8px; font-size: 13px; animation-delay: 0s; }
.night-star-2 { top: 12px; right: 5px; font-size: 8px; animation-delay: .45s; }
.night-star-3 { bottom: 7px; left: 4px; font-size: 9px; animation-delay: .9s; }
.night-star-4 { bottom: 4px; right: 11px; font-size: 14px; animation-delay: .25s; }
.night-star-5 { top: 25px; left: 24px; font-size: 6px; animation-delay: 1.1s; }

@keyframes twinkle {
  0%, 100% { opacity: .35; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.25); }
}

/* NIGHT HAZY GREY SKY */

.hazy-sky {
  position: relative;
  width: 52px;
  height: 52px;
  margin: 0 auto;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 45%,
    rgba(220,220,220,.95) 0%,
    rgba(180,183,188,.8) 35%,
    rgba(115,120,126,.65) 65%,
    rgba(70,74,80,.3) 100%
  );
  box-shadow: 0 0 8px rgba(220,220,220,.35), 0 0 16px rgba(190,190,190,.2);
  overflow: hidden;
}

.hazy-sky::before,
.hazy-sky::after {
  content: "";
  position: absolute;
  left: -8px;
  width: 68px;
  height: 16px;
  border-radius: 50%;
  background: rgba(210,210,210,.22);
  filter: blur(4px);
}

.hazy-sky::before { top: 11px; }
.hazy-sky::after { bottom: 10px; background: rgba(150,150,150,.28); }

/* METEOCONS WEATHER ICONS */

.wx-icon {
  display: block;
  margin: 0 auto;
  max-width: 100%;
  height: auto;
}

.icon .wx-icon { width: 100px; }
.hour-icon .wx-icon { width: 58px; }
.day-icon .wx-icon { width: 72px; }

/* DAY / NIGHT HOURLY CARDS */

.hour.sunny-day { background: linear-gradient(to bottom,#fff6a8 0%,#dff4ff 100%); }
.hour.partly-cloudy-day { background: linear-gradient(to bottom,#dceeff 0%,#e8e8e8 100%); }
.hour.cloudy-day { background: linear-gradient(to bottom,#d5d8dc 0%,#bfc3c7 100%); }
.hour.rainy-day { background: linear-gradient(to bottom,#c3d2df 0%,#9aaab8 100%); }
.hour.snowy-day { background: linear-gradient(to bottom,#eef7ff 0%,#d5e2ec 100%); }
.hour.stormy-day { background: linear-gradient(to bottom,#999da3 0%,#686d73 100%); color: white; }

.hour.sunny-night { background: linear-gradient(to bottom,#394867 0%,#1d2940 100%); color: white; }
.hour.partly-cloudy-night { background: linear-gradient(to bottom,#454f62 0%,#252d3b 100%); color: white; }
.hour.cloudy-night { background: linear-gradient(to bottom,#4b4f55 0%,#2d3035 100%); color: white; }
.hour.rainy-night { background: linear-gradient(to bottom,#3f5366 0%,#263440 100%); color: white; }
.hour.snowy-night { background: linear-gradient(to bottom,#4e6070 0%,#303e49 100%); color: white; }
.hour.stormy-night { background: linear-gradient(to bottom,#3a3b40 0%,#202125 100%); color: white; }

/* DAILY FORECAST */

.daily {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.day {
  text-align: center;
  font-size: 1.3rem;
  flex: 1;
  min-width: 0;
  padding: calc(14px - var(--padspace)) calc(8px - var(--padspace));
  border-radius: 16px;
  box-sizing: border-box;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  transition: background .3s ease;
}

.day-date { font-weight: 600; margin-bottom: 8px; }
.day-icon { font-size: 2.8rem; margin: 6px 0 2px 0; }

.day-condition {
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.1;
  min-height: 1.2em;
  margin-bottom: 8px;
}

.day-temp { font-size: 1.25rem; font-weight: 500; }

.day.sunny { background: linear-gradient(to bottom,#fff7b2 0%,#dff4ff 100%); }
.day.partly-cloudy { background: linear-gradient(to bottom,#dceeff 0%,#e8e8e8 100%); }
.day.cloudy { background: linear-gradient(to bottom,#d5d8dc 0%,#bfc3c7 100%); }
.day.rainy { background: linear-gradient(to bottom,#b9c9d8 0%,#8f9eab 100%); }
.day.snowy { background: linear-gradient(to bottom,#eef7ff 0%,#d5e2ec 100%); }
.day.stormy { background: linear-gradient(to bottom,#8e9298 0%,#5f646b 100%); color: white; }

.updated {
  margin-top: calc(12px - var(--padspace));
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 1rem;
  opacity: .7;
}

footer {
  margin-top: auto;
  text-align: center;
  opacity: .5;
  padding-top: 12px;
}

/* ROEPER MAP OVERLAY */

.map-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.65);
  align-items: center;
  justify-content: center;
}

.map-container {
  position: relative;
  width: 90vw;
  height: 90vh;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,.4);
}

.map-container iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.map-close {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
  padding: 9px 14px;
  border: 0;
  border-radius: 6px;
  background: #222;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.map-open {
  position: absolute;
  top: 10px;
  right: 110px;
  z-index: 2;
  padding: 9px 14px;
  border-radius: 6px;
  background: #4285f4;
  color: white;
  font-size: 16px;
  text-decoration: none;
}

@media (max-width: 1100px) {
  .temp { font-size: 6rem; }
  .date { font-size: 1.6rem; }
  .clock { font-size: 3rem; }
  .icon .wx-icon { width: 80px; }
  .day-icon .wx-icon { width: 60px; }
  .hilo { font-size: 1.7rem; }

  .roeper-button {
    font-size: 1.1rem;
    padding: calc(15px - var(--padspace)) calc(20px - var(--padspace));
  }

  .daily { gap: 6px; }

  .day {
    font-size: 1.05rem;
    padding: calc(10px - var(--padspace)) calc(5px - var(--padspace));
  }

  .day-condition { font-size: .9rem; }
}

@media (max-width: 800px) {
  .hourly { gap: 5px; }
  .hour { font-size: 1rem; }
  .hourly-nav button { width: 55px; }

  .roeper-button {
    font-size: 1rem;
    padding: calc(13px - var(--padspace)) calc(15px - var(--padspace));
  }

  .drive-box { max-width: 220px; }
  .drive-time { font-size: 1.8rem; }
  .drive-detail { font-size: .8rem; }
  .drive-refresh { font-size: .75rem; }
  .hour-condition { font-size: .7rem; }
  .hour-icon .wx-icon { width: 44px; }
  .day-condition { font-size: .75rem; }
}
</style>
</head>

<body>
<div class="container">

<!-- SECTION 1 - CURRENT WEATHER -->
<div class="card section">
<table width="100%">
<tr>
<td width="10%">
  <div class="icon" id="icon">🌡️</div>
</td>

<td width="15%">
  <div class="temp" id="temp">--°</div>
</td>

<td width="20%">
  <div class="hilo">
    <table width="100%">
      <tr>
        <td align="right">High:</td>
        <td align="left"><span id="high">--°</span></td>
      </tr>
      <tr>
        <td align="right">Low:</td>
        <td align="left"><span id="low">--°</span></td>
      </tr>
    </table>
  </div>
</td>

<td width="25%" class="roeper-button-cell">
  <button class="roeper-button" onclick="showRoeperMap()">
    Show time to Roeper
  </button>

  <div class="drive-box" id="driveBox" style="display:none">
    <div class="drive-label">Drive to Roeper</div>
    <div class="drive-time" id="driveTime">--</div>
    <div class="drive-detail" id="driveDetail">Loading...</div>
    <div class="drive-refresh" id="driveRefresh"></div>
    <div class="drive-note" id="driveNote"></div>
  </div>
</td>

<td width="30%">
  <div class="clock-wrap">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
  </div>
</td>
</tr>
</table>

<div class="updated">
  <span id="updated"></span>
</div>
</div>

<!-- SECTION 2 - NEXT 12 HOURS -->
<div class="section">
  <div class="hourly-header">
    <div class="hourly-title">Next 12 Hours</div>
    <div class="hourly-day" id="hourlyDay">—</div>

    <div class="hourly-nav">
      <button id="hourlyBack" type="button"
              aria-label="Previous 12 hours"
              title="Previous 12 hours">‹</button>

      <button id="hourlyForward" type="button"
              aria-label="Next 12 hours"
              title="Next 12 hours">›</button>
    </div>
  </div>

  <div class="hourly" id="hourly"></div>
</div>

<!-- SECTION 3 - 8 DAY FORECAST -->
<div class="section">
  <div class="section-title">8-Day Forecast</div>
  <div class="daily" id="daily"></div>
</div>

<footer>Novi, Michigan</footer>
</div>

<!-- ROEPER MAP OVERLAY -->
<div id="mapOverlay" class="map-overlay">
  <div class="map-container">
    <a class="map-open" id="mapOpenLink" target="_blank" rel="noopener">Open in Maps ↗</a>
    <button class="map-close" onclick="closeRoeperMap()">Close ✕</button>
    <iframe
      id="roeperMapFrame"
      title="Directions to Roeper"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</div>

<script>
/* GLOBAL PADDING */
const padspace = 2;

/* WEATHER LOCATION */
const LAT = 42.4806;
const LON = -83.4755;
const TZ = "America/Detroit";

/* ROEPER ROUTE */
const ROEPER_ORIGIN = "24010 Greening Dr, Novi, MI 48375";
const ROEPER_DESTINATION = "1051 Oakland Ave, Birmingham, MI 48009";

let roeperMapRefreshTimer = null;

/*
 * Google blocks its regular directions page from being shown in an iframe,
 * so the popup uses an embeddable directions view instead:
 *
 * - With a Google Maps Embed API key (free; enable "Maps Embed API" in the
 *   Google Cloud console and paste the key below): the official embed.
 * - Without a key: Google's older, unofficial embed URL. It needs no setup
 *   but is not guaranteed to keep working.
 *
 * The "Open in Maps" button in the popup always opens the full Google Maps
 * route (live drive time) in a new tab or the Maps app.
 */
const GOOGLE_MAPS_EMBED_KEY = "";

function showRoeperMap() {
  const overlay = document.getElementById("mapOverlay");
  const frame = document.getElementById("roeperMapFrame");
  const openLink = document.getElementById("mapOpenLink");

  const origin = encodeURIComponent(ROEPER_ORIGIN);
  const destination = encodeURIComponent(ROEPER_DESTINATION);

  openLink.href =
    "https://www.google.com/maps/dir/?api=1" +
    "&origin=" + origin +
    "&destination=" + destination +
    "&travelmode=driving";

  const embedUrl = GOOGLE_MAPS_EMBED_KEY
    ? "https://www.google.com/maps/embed/v1/directions" +
      "?key=" + encodeURIComponent(GOOGLE_MAPS_EMBED_KEY) +
      "&origin=" + origin +
      "&destination=" + destination +
      "&mode=driving"
    : "https://maps.google.com/maps" +
      "?saddr=" + origin +
      "&daddr=" + destination +
      "&dirflg=d&output=embed";

  overlay.style.display = "flex";

  function refreshMap() {
    frame.src = embedUrl + "&refresh=" + Date.now();
  }

  refreshMap();

  if (roeperMapRefreshTimer) {
    clearInterval(roeperMapRefreshTimer);
  }

  roeperMapRefreshTimer = setInterval(refreshMap, 60000);
}

function closeRoeperMap() {
  const overlay = document.getElementById("mapOverlay");
  const frame = document.getElementById("roeperMapFrame");

  overlay.style.display = "none";
  frame.src = "about:blank";

  if (roeperMapRefreshTimer) {
    clearInterval(roeperMapRefreshTimer);
    roeperMapRefreshTimer = null;
  }
}

/* Close overlay when clicking outside the map window */
document.getElementById("mapOverlay").addEventListener("click", function(event) {
  if (event.target === this) {
    closeRoeperMap();
  }
});

/* Close overlay with Escape key */
document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeRoeperMap();
  }
});

/* CLOCK */
function updateClock() {
  const now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      timeZone: TZ,
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {
      timeZone: TZ,
      hour: "numeric",
      minute: "2-digit"
    });
}

setInterval(updateClock, 1000);
updateClock();

/*
 * WEATHER ICONS
 * Meteocons by Bas Milius (MIT license), loaded from the jsDelivr CDN.
 * If an icon fails to load, the old emoji is shown instead.
 */
const ICON_BASE = "https://cdn.jsdelivr.net/npm/@meteocons/svg/fill/";

function weatherEmoji(code) {
  const icons = {
    0:"☀️", 1:"🌤️", 2:"⛅", 3:"☁️",
    45:"🌫️", 48:"🌫️", 51:"🌦️", 53:"🌦️",
    55:"🌧️", 56:"🌧️", 57:"🌧️", 61:"🌧️",
    63:"🌧️", 65:"🌧️", 66:"🌧️", 67:"🌧️",
    71:"🌨️", 73:"❄️", 75:"❄️", 77:"❄️",
    80:"🌦️", 81:"🌧️", 82:"🌧️", 85:"🌨️",
    86:"❄️", 95:"⛈️", 96:"⛈️", 99:"⛈️"
  };

  return icons[Number(code)] ?? "🌡️";
}

/* Open-Meteo weather code -> Meteocons icon name */
function meteoconName(code, isDay) {
  const dn = isDay ? "day" : "night";

  if (code === 0) return `clear-${dn}`;
  if (code === 1) return `mostly-clear-${dn}`;
  if (code === 2) return `partly-cloudy-${dn}`;
  if (code === 3) return `overcast-${dn}`;
  if (code === 45 || code === 48) return `fog-${dn}`;
  if (code >= 51 && code <= 55) return "drizzle";
  if (code === 56 || code === 57) return "sleet";
  if (code >= 61 && code <= 65) return "rain";
  if (code === 66 || code === 67) return "sleet";
  if (code >= 71 && code <= 77) return "snow";
  if (code >= 80 && code <= 82) return `partly-cloudy-${dn}-rain`;
  if (code === 85 || code === 86) return `partly-cloudy-${dn}-snow`;
  if (code === 95) return `thunderstorms-${dn}`;
  if (code === 96 || code === 99) return `thunderstorms-${dn}-hail`;

  return null;
}

function weatherIcon(code, isDay = true) {
  code = Number(code);

  const name = meteoconName(code, isDay);
  const emoji = weatherEmoji(code);

  if (!name) return emoji;

  return `<img class="wx-icon" src="${ICON_BASE}${name}.svg" alt="" ` +
         `onerror="this.replaceWith(document.createTextNode('${emoji}'))">`;
}

/* WEATHER CATEGORY FOR CARD BACKGROUNDS */
function getHourlyWeatherClass(code) {
  code = Number(code);

  if (code === 0) return "sunny";
  if (code === 1 || code === 2) return "partly-cloudy";
  if (code === 3 || code === 45 || code === 48) return "cloudy";

  if ((code >= 51 && code <= 67) ||
      (code >= 80 && code <= 82)) return "rainy";

  if ((code >= 71 && code <= 77) ||
      (code >= 85 && code <= 86)) return "snowy";

  if (code >= 95) return "stormy";

  return "cloudy";
}

/* HUMAN-READABLE WEATHER DESCRIPTION */
function getWeatherDescription(code) {
  code = Number(code);

  if (code === 0) return "Clear";
  if (code === 1) return "Mostly clear";
  if (code === 2) return "Partly cloudy";
  if (code === 3) return "Cloudy";
  if (code === 45 || code === 48) return "Foggy";
  if (code >= 51 && code <= 57) return "Drizzle";
  if (code >= 61 && code <= 67) return "Rain";
  if (code >= 71 && code <= 77) return "Snow";
  if (code >= 80 && code <= 82) return "Rain showers";
  if (code >= 85 && code <= 86) return "Snow showers";
  if (code >= 95) return "Thunderstorms";

  return "Conditions unavailable";
}

/* NIGHT CLEAR-SKY STARS */
function getNightStarsHTML() {
  return `
    <div class="night-stars">
      <span class="night-star night-star-1">✦</span>
      <span class="night-star night-star-2">✧</span>
      <span class="night-star night-star-3">✦</span>
      <span class="night-star night-star-4">✦</span>
      <span class="night-star night-star-5">·</span>
    </div>
  `;
}

/* NIGHT HAZY GREY SKY */
function getHazySkyHTML() {
  return `<div class="hazy-sky"></div>`;
}

/* NIGHT CONDITION ICON (Meteocons night variants; the old CSS stars and
   hazy-sky helpers above are no longer used) */
function getNightConditionIcon(code) {
  return weatherIcon(code, false);
}

/* CURRENT TIME IN DETROIT, formatted like Open-Meteo hourly times */
function detroitNowString() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());

  const p = {};
  parts.forEach(x => { p[x.type] = x.value; });

  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}

/* HOURLY DATA */
let hourlyPageOffset = 0;
let hourlyData = null;

/* RENDER HOURLY FORECAST */
function renderHourly() {
  const hourly = document.getElementById("hourly");
  const dayLabel = document.getElementById("hourlyDay");
  const backButton = document.getElementById("hourlyBack");
  const forwardButton = document.getElementById("hourlyForward");

  hourly.innerHTML = "";

  if (!hourlyData || !hourlyData.time || hourlyData.time.length === 0) {
    dayLabel.textContent = "—";
    backButton.disabled = true;
    forwardButton.disabled = true;
    return;
  }

  /* Compare in Detroit time so the row is right on any device timezone. */
  const nowDetroit = detroitNowString();

  let firstFutureIndex = hourlyData.time.findIndex(time => time >= nowDetroit);

  if (firstFutureIndex < 0) {
    firstFutureIndex = hourlyData.time.length - 1;
  }

  const startIndex = Math.min(
    firstFutureIndex + hourlyPageOffset,
    Math.max(0, hourlyData.time.length - 1)
  );

  const endIndex = Math.min(startIndex + 12, hourlyData.time.length);

  const [year, month, day] =
    hourlyData.time[startIndex].slice(0, 10).split("-").map(Number);

  const displayDate = new Date(year, month - 1, day);

  dayLabel.textContent = displayDate.toLocaleDateString([], {
    weekday: "long"
  });

  for (let i = startIndex; i < endIndex; i++) {
    const timeString = hourlyData.time[i];
    const [datePart, timePart] = timeString.split("T");
    const [y, m, d] = datePart.split("-").map(Number);
    const [h, min] = timePart.split(":").map(Number);

    const t = new Date(y, m - 1, d, h, min);
    const code = Number(hourlyData.weather_code[i]);
    const isDaytime = Number(hourlyData.is_day[i]) === 1;
    const weatherClass = getHourlyWeatherClass(code);

    const timeClass = isDaytime
      ? `${weatherClass}-day`
      : `${weatherClass}-night`;

    const condition = getWeatherDescription(code);
    const icon = weatherIcon(code, isDaytime);

    hourly.innerHTML += `
      <div class="hour ${timeClass}">
        <div>${t.toLocaleTimeString([], { hour: "numeric" })}</div>
        <div class="hour-icon">${icon}</div>
        <div class="hour-condition">${condition}</div>
        <div>${Math.round(hourlyData.temperature_2m[i])}°</div>
      </div>
    `;
  }

  backButton.disabled = hourlyPageOffset <= 0;
  forwardButton.disabled = endIndex >= hourlyData.time.length;
}

/* HOURLY NAVIGATION */
document.getElementById("hourlyBack").addEventListener("click", () => {
  hourlyPageOffset = Math.max(0, hourlyPageOffset - 12);
  renderHourly();
});

document.getElementById("hourlyForward").addEventListener("click", () => {
  if (hourlyData && hourlyPageOffset + 12 < hourlyData.time.length) {
    hourlyPageOffset += 12;
    renderHourly();
  }
});

/*
 * DAILY CONDITION CODE
 * Open-Meteo's daily weather_code is the most severe code of the whole 24
 * hours, so one cloudy overnight hour makes the day "Cloudy". Instead:
 *  - any precipitation/storm hour (code 51+) in the day wins (worst one), and
 *  - otherwise use the most common code during daylight hours (ties go to
 *    the cloudier code).
 * Falls back to the API's daily code if no hourly data matches that date.
 */
function getDayCode(dateStr, fallbackCode) {
  const counts = {};
  let worstPrecip = null;

  for (let i = 0; i < hourlyData.time.length; i++) {
    if (!hourlyData.time[i].startsWith(dateStr)) continue;

    const c = Number(hourlyData.weather_code[i]);

    if (c >= 51) {
      worstPrecip = worstPrecip === null ? c : Math.max(worstPrecip, c);
    }

    if (Number(hourlyData.is_day[i]) === 1) {
      counts[c] = (counts[c] || 0) + 1;
    }
  }

  if (worstPrecip !== null) return worstPrecip;

  let best = null;
  for (const key of Object.keys(counts)) {
    const c = Number(key);
    if (best === null ||
        counts[c] > counts[best] ||
        (counts[c] === counts[best] && c > best)) {
      best = c;
    }
  }

  return best !== null ? best : Number(fallbackCode);
}

/* CURRENT CONDITIONS ICON (day/night aware) */
function setCurrentIcon(code, isDay) {
  const el = document.getElementById("icon");

  el.innerHTML = weatherIcon(code, Number(isDay) === 1);
}

/* LOAD WEATHER */
let lastGoodUpdate = null;
let weatherRetryTimer = null;

async function loadWeather() {
  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&current=temperature_2m,weather_code,is_day` +
    `&hourly=temperature_2m,weather_code,is_day` +
    `&daily=temperature_2m_max,temperature_2m_min,weather_code` +
    `&temperature_unit=fahrenheit&timezone=${encodeURIComponent(TZ)}&forecast_days=9`;

  try {
    const response = await fetch(url, { cache: "no-store" });

    if (!response.ok) {
      throw new Error(`Weather request failed: ${response.status}`);
    }

    const d = await response.json();

    /* Validate before touching the page so a bad response can't half-update it. */
    if (!d.current || !d.hourly || !d.daily ||
        !Array.isArray(d.daily.time) || d.daily.time.length < 9 ||
        !Array.isArray(d.hourly.time)) {
      throw new Error("Weather response was missing expected data");
    }

    document.getElementById("temp").textContent =
      Math.round(d.current.temperature_2m) + "°";

    setCurrentIcon(d.current.weather_code, d.current.is_day);

    document.getElementById("high").textContent =
      Math.round(d.daily.temperature_2m_max[0]) + "°";

    document.getElementById("low").textContent =
      Math.round(d.daily.temperature_2m_min[0]) + "°";

    hourlyData = d.hourly;
    renderHourly();

    /* DAILY FORECAST */
    const daily = document.getElementById("daily");
    daily.innerHTML = "";

    /* Eight forecast days starting tomorrow. */
    for (let i = 1; i <= 8; i++) {
      const [year, month, day] = d.daily.time[i].split("-").map(Number);
      const dt = new Date(year, month - 1, day);
      const code = getDayCode(d.daily.time[i], d.daily.weather_code[i]);
      const category = getHourlyWeatherClass(code);
      const condition = getWeatherDescription(code);

      daily.innerHTML += `
        <div class="day ${category}">
          <div class="day-date">
            ${dt.toLocaleDateString([], {
              weekday: "short",
              month: "numeric",
              day: "numeric"
            })}
          </div>

          <div class="day-icon">${weatherIcon(code)}</div>
          <div class="day-condition">${condition}</div>

          <div class="day-temp">
            ${Math.round(d.daily.temperature_2m_max[i])}°
            /
            ${Math.round(d.daily.temperature_2m_min[i])}°
          </div>
        </div>
      `;
    }

    lastGoodUpdate = new Date().toLocaleTimeString([], {
      timeZone: TZ,
      hour: "numeric",
      minute: "2-digit"
    });

    document.getElementById("updated").textContent =
      "Last updated: " + lastGoodUpdate;

    if (weatherRetryTimer) {
      clearTimeout(weatherRetryTimer);
      weatherRetryTimer = null;
    }
  } catch (error) {
    console.error("Unable to load weather:", error);

    document.getElementById("updated").textContent = lastGoodUpdate
      ? "Update failed - showing data from " + lastGoodUpdate
      : "Weather data unavailable";

    /* Retry in a minute instead of waiting for the next 5-minute refresh. */
    if (weatherRetryTimer) clearTimeout(weatherRetryTimer);
    weatherRetryTimer = setTimeout(loadWeather, 60000);
  }
}

loadWeather();
setInterval(loadWeather, 300000);

/*
 * DRIVE TIME TO ROEPER (live traffic, fastest route)
 * Uses the TomTom Routing API. Get a free key (no credit card; about 20,000
 * routing requests per month) at https://developer.tomtom.com and paste it
 * below. The page asks for up to 3 route options and shows the fastest.
 */
const TOMTOM_KEY = "bGApSVLEyCknqcd8a3FRE4C53AxOq6TL";

const geocodeCache = {};

/* Build an error that includes TomTom's reason, so it can be shown on screen. */
async function httpError(label, response) {
  let detail = "";

  try {
    const text = await response.text();

    try {
      const j = JSON.parse(text);
      detail = (j.detailedError && j.detailedError.message) ||
               j.error || j.errorText || j.message || "";
    } catch (e) {
      detail = text;
    }
  } catch (e) { /* no body available */ }

  return new Error(
    `${label} failed: ${response.status}` +
    (detail ? ` (${String(detail).slice(0, 100)})` : "")
  );
}

/* Address -> coordinates, looked up once and remembered. */
async function geocodeAddress(address) {
  if (geocodeCache[address]) return geocodeCache[address];

  const storeKey = "geo:" + address;

  try {
    const saved = localStorage.getItem(storeKey);
    if (saved) {
      geocodeCache[address] = JSON.parse(saved);
      return geocodeCache[address];
    }
  } catch (e) { /* storage unavailable; look it up instead */ }

  const url =
    "https://api.tomtom.com/search/2/geocode/" + encodeURIComponent(address) +
    ".json?key=" + encodeURIComponent(TOMTOM_KEY.trim()) + "&limit=1&countrySet=US";

  const response = await fetch(url);
  if (!response.ok) throw await httpError("Geocoding", response);

  const data = await response.json();
  const pos = data.results && data.results[0] && data.results[0].position;
  if (!pos) throw new Error("Address not found: " + address);

  const point = { lat: pos.lat, lon: pos.lon };
  geocodeCache[address] = point;

  try { localStorage.setItem(storeKey, JSON.stringify(point)); } catch (e) {}

  return point;
}

function formatDriveTime(seconds) {
  const mins = Math.max(1, Math.round(seconds / 60));
  if (mins < 60) return `${mins} min`;

  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h} hr ${m} min` : `${h} hr`;
}

let lastDriveUpdate = null;

async function loadDriveTime() {
  const timeEl = document.getElementById("driveTime");
  const detailEl = document.getElementById("driveDetail");
  const noteEl = document.getElementById("driveNote");
  const refreshEl = document.getElementById("driveRefresh");

  if (!TOMTOM_KEY.trim()) {
    timeEl.textContent = "--";
    detailEl.textContent = "Add a free TomTom API key to show drive time";
    return;
  }

  try {
    const [from, to] = await Promise.all([
      geocodeAddress(ROEPER_ORIGIN),
      geocodeAddress(ROEPER_DESTINATION)
    ]);

    const url =
      "https://api.tomtom.com/routing/1/calculateRoute/" +
      `${from.lat},${from.lon}:${to.lat},${to.lon}/json` +
      "?key=" + encodeURIComponent(TOMTOM_KEY.trim()) +
      "&traffic=true&travelMode=car&routeType=fastest&maxAlternatives=2";

    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw await httpError("Routing", response);

    const data = await response.json();
    const routes = (data.routes || []).filter(r => r.summary);
    if (routes.length === 0) throw new Error("No routes returned");

    /* Fastest option including current traffic. */
    const best = routes.reduce((a, b) =>
      b.summary.travelTimeInSeconds < a.summary.travelTimeInSeconds ? b : a);

    const s = best.summary;
    const delayMin = Math.round((s.trafficDelayInSeconds || 0) / 60);
    const miles = (s.lengthInMeters / 1609.344).toFixed(1);

    timeEl.textContent = formatDriveTime(s.travelTimeInSeconds);
    timeEl.className = "drive-time " +
      (delayMin < 2 ? "drive-good" : delayMin < 8 ? "drive-slow" : "drive-bad");

    detailEl.textContent =
      (delayMin >= 2 ? `+${delayMin} min traffic` : "Light traffic") +
      ` · ${miles} mi`;

    lastDriveUpdate = new Date().toLocaleTimeString([], {
      timeZone: TZ,
      hour: "numeric",
      minute: "2-digit"
    });

    refreshEl.textContent = `Last refreshed: ${lastDriveUpdate}`;

    noteEl.textContent =
      `Fastest of ${routes.length} route${routes.length === 1 ? "" : "s"} · ` +
      `traffic by TomTom`;
  } catch (error) {
    console.error("Unable to load drive time:", error);

    detailEl.textContent = lastDriveUpdate
      ? "Update failed - showing older data"
      : "Drive time unavailable";

    /* Show the reason on screen (handy on a tablet with no dev tools). */
    noteEl.textContent = String(error && error.message || error).slice(0, 140);
  }
}

/*
 * The drive time is only shown from 6:00 AM until 8:00 AM Detroit time, and
 * only fetched in that window (every 4 minutes), which also saves requests.
 */
const DRIVE_START_HOUR = 15;
const DRIVE_END_HOUR = 18;
const DRIVE_REFRESH_MS = 4 * 60 * 1000;
let lastDriveFetch = 0;

function inDriveWindow() {
  const hour = Number(
    new Intl.DateTimeFormat("en-US", {
      timeZone: TZ,
      hour: "numeric",
      hourCycle: "h23"
    }).format(new Date())
  );

  return hour >= DRIVE_START_HOUR && hour < DRIVE_END_HOUR;
}

function driveTick() {
  const box = document.getElementById("driveBox");

  if (!inDriveWindow()) {
    box.style.display = "none";
    lastDriveFetch = 0;
    lastDriveUpdate = null;

    /* Clear yesterday's numbers so they don't flash when the window reopens. */
    document.getElementById("driveTime").textContent = "--";
    document.getElementById("driveTime").className = "drive-time";
    document.getElementById("driveDetail").textContent = "Loading...";
    document.getElementById("driveRefresh").textContent = "";
    document.getElementById("driveNote").textContent = "";
    return;
  }

  box.style.display = "";

  if (Date.now() - lastDriveFetch >= DRIVE_REFRESH_MS) {
    lastDriveFetch = Date.now();
    loadDriveTime();
  }
}

driveTick();
setInterval(driveTick, 15000);
</script>
