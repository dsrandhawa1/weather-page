<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Novi MI Dashboard</title>

<style>
:root {
  --padspace: 2px;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: white;
}

.container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;

}

.card {
  background: #ededed;
  border-radius: 18px;

.date {

/* CURRENT MOON */

.current-moon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 10px;
  vertical-align: middle;
  transform: translateY(20px);
}

.moon {
  position: relative;
  width: 102px;
  height: 102px;
  border-radius: 20px;
  background: #444;
  box-shadow:
    0 0 4px rgba(0,0,0,.10),
    0 0 10px rgba(237,237,237,.8);
  overflow: hidden;
  box-sizing: border-box;
}

/* Actual visible moon circle */
.moon::before {
  content: "";
  position: absolute;
  width: 83px;
  height: 83px;
  left: 9.5px;
  top: 9.5px;
  border-radius: 50%;
  background: white;
}

/* Dark/hidden portion of moon */
.moon::after {
  content: "";
  position: absolute;
  width: 83px;
  height: 83px;
  left: 9.5px;
  top: 9.5px;
  border-radius: 50%;
  background: #444;
}

/* New moon */
.moon-new::before {
  display: none;
}

.moon-new::after {
  display: none;
}

/* Waxing crescent */
.moon-waxing-crescent::after {
  left: -9.5px;
  top: 9.5px;
}

/* First quarter */
.moon-first-quarter {
  background: #444;
}

.moon-first-quarter::after {
  width: 41.5px;
  height: 83px;
  left: 9.5px;
  top: 9.5px;
  border-radius: 41.5px 0 0 41.5px;
}

/* Waxing gibbous */
.moon-waxing-gibbous::after {
  left: -9.5px;
  top: 9.5px;
}

/* Full moon */
.moon-full::after {
  display: none;
}

/* Waning gibbous */
.moon-waning-gibbous::after {
  left: 28.5px;
  top: 9.5px;
}

/* Last quarter */
.moon-last-quarter {
  background: #444;
}

.moon-last-quarter::before {
  background: white;
}

.moon-last-quarter::after {
  width: 41.5px;
  height: 83px;
  left: 51px;
  top: 9.5px;
  border-radius: 0 41.5px 41.5px 0;
}

/* Waning crescent */
.moon-waning-crescent::after {
  left: 28.5px;
  top: 9.5px;
}

<body>
<div class="container">

<!-- SECTION 1 - CURRENT WEATHER -->

<div class="card section">

    <div class="hourly-day" id="hourlyDay">—</div>

    <div class="hourly-nav">
      <button id="hourlyBack" type="button" aria-label="Previous 12 hours" title="Previous 12 hours">‹</button>
      <button id="hourlyForward" type="button" aria-label="Next 12 hours" title="Next 12 hours">›</button>
    </div>
  </div>

  <div class="hourly" id="hourly"></div>

<script>
/* GLOBAL PADDING */
const padspace = 2;

/* LOCATION */
const LAT = 42.4806;
const LON = -83.4755;

/* CLOCK */
function updateClock() {
  const now = new Date();

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });
}

setInterval(updateClock, 1000);
updateClock();

/* WEATHER ICONS */
function weatherIcon(code) {
  const icons = {
    0:"☀️", 1:"🌤️", 2:"⛅", 3:"☁️",
    45:"🌫️", 48:"🌫️",
    51:"🌦️", 53:"🌦️", 55:"🌧️",
    56:"🌧️", 57:"🌧️",
    61:"🌧️", 63:"🌧️", 65:"🌧️",
    66:"🌧️", 67:"🌧️",
    71:"🌨️", 73:"❄️", 75:"❄️", 77:"❄️",
    80:"🌦️", 81:"🌧️", 82:"🌧️",
    85:"🌨️", 86:"❄️",
    95:"⛈️", 96:"⛈️", 99:"⛈️"
  };

  return icons[Number(code)] ?? "🌡️";
}

/* WEATHER CATEGORY FOR CARD BACKGROUNDS */
function getHourlyWeatherClass(code) {
  code = Number(code);

  if (code === 0) return "sunny";
  if (code === 1 || code === 2) return "partly-cloudy";
  if (code === 3 || code === 45 || code === 48) return "cloudy";

  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82))
    return "rainy";

  if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86))
    return "snowy";

  if (code >= 95) return "stormy";

  return "cloudy";
}

/* HUMAN-READABLE WEATHER DESCRIPTION */
function getWeatherDescription(code) {
  code = Number(code);

  if (code === 0) return "Clear";
  if (code === 1) return "Mostly clear";
  if (code === 2) return "Partly cloudy";
  if (code === 3) return "Cloudy";
  if (code === 45 || code === 48) return "Foggy";

  if (code >= 51 && code <= 57) return "Drizzle";
  if (code >= 61 && code <= 67) return "Rain";
  if (code >= 71 && code <= 77) return "Snow";
  if (code >= 80 && code <= 82) return "Rain showers";
  if (code >= 85 && code <= 86) return "Snow showers";
  if (code >= 95) return "Thunderstorms";

  return "Conditions unavailable";
}

/* MOON PHASE */
function getMoonPhase(date) {
  const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14);
  const synodicMonth = 29.530588853;
  const daysSince = (date.getTime() - knownNewMoon) / 86400000;
  const phase = ((daysSince % synodicMonth) + synodicMonth) % synodicMonth;
  const fraction = phase / synodicMonth;

  if (fraction < 0.035 || fraction >= 0.965)
    return { type: "new", name: "New moon" };

  if (fraction < 0.215)
    return { type: "waxing-crescent", name: "Waxing crescent" };

  if (fraction < 0.285)
    return { type: "first-quarter", name: "First quarter" };

  if (fraction < 0.465)
    return { type: "waxing-gibbous", name: "Waxing gibbous" };

  if (fraction < 0.535)
    return { type: "full", name: "Full moon" };

  if (fraction < 0.715)
    return { type: "waning-gibbous", name: "" };

  if (fraction < 0.785)
    return { type: "last-quarter", name: "Last quarter" };

  return { type: "waning-crescent", name: "Waning crescent" };
}

/* CURRENT MOON HTML */
function getCurrentMoonHTML(date) {
  const moon = getMoonPhase(date);

  return `
    <div class="moon moon-${moon.type}" title="${moon.name || "Moon phase"}"></div>
    ${moon.name ? `<div class="current-moon-name">${moon.name}</div>` : ""}
  `;
}

/* NIGHT STARS */
function getNightStarsHTML() {
  return `
    <div class="night-stars">
      <span class="star1">✦</span>
      <span class="star2">✧</span>
      <span class="star3">✦</span>
      <span class="star2">·</span>
      <span class="star1">✧</span>
    </div>
  `;
}

/* NIGHT CONDITION ICON */
function getNightConditionIcon(code) {
  code = Number(code);

  if (code >= 71 && code <= 77 || code === 85 || code === 86)
    return "❄️";

  if (code >= 51 && code <= 67 || code >= 80 && code <= 82)
    return "🌧️";

  if (code >= 95)
    return "⛈️";

  if (code === 45 || code === 48)
    return "🌫️";

  if (code === 3)
    return "☁️";

  if (code === 2)
    return "☁️";

  return "";
}

/* HOURLY DATA */
let hourlyPageOffset = 0;
let hourlyData = null;

/* RENDER HOURLY FORECAST */
function renderHourly() {
  const hourly = document.getElementById("hourly");
  const dayLabel = document.getElementById("hourlyDay");
  const backButton = document.getElementById("hourlyBack");
  const forwardButton = document.getElementById("hourlyForward");

  hourly.innerHTML = "";

  if (!hourlyData || !hourlyData.time || hourlyData.time.length === 0) {
    dayLabel.textContent = "—";
    backButton.disabled = true;
    forwardButton.disabled = true;
    return;
  }

  const now = new Date();

  let firstFutureIndex = hourlyData.time.findIndex(time => {
    const [datePart, timePart] = time.split("T");
    const [y, m, d] = datePart.split("-").map(Number);
    const [h, min] = timePart.split(":").map(Number);
    return new Date(y, m - 1, d, h, min) >= now;
  });

  if (firstFutureIndex < 0)
    firstFutureIndex = hourlyData.time.length - 1;

  const startIndex = Math.min(
    firstFutureIndex + hourlyPageOffset,
    Math.max(0, hourlyData.time.length - 1)
  );

  const endIndex = Math.min(startIndex + 12, hourlyData.time.length);

  const [year, month, day] =
    hourlyData.time[startIndex].slice(0, 10).split("-").map(Number);

  const displayDate = new Date(year, month - 1, day);

  dayLabel.textContent = displayDate.toLocaleDateString([], {
    weekday: "long"
  });

  for (let i = startIndex; i < endIndex; i++) {
    const timeString = hourlyData.time[i];
    const [datePart, timePart] = timeString.split("T");
    const [y, m, d] = datePart.split("-").map(Number);
    const [h, min] = timePart.split(":").map(Number);
    const t = new Date(y, m - 1, d, h, min);

    const code = Number(hourlyData.weather_code[i]);
    const isDaytime = Number(hourlyData.is_day[i]) === 1;

    const weatherClass = getHourlyWeatherClass(code);
    const timeClass = isDaytime
      ? `${weatherClass}-day`
      : `${weatherClass}-night`;

    const condition = getWeatherDescription(code);

    const icon = isDaytime
      ? weatherIcon(code)
      : getNightStarsHTML();

    const conditionText = isDaytime
      ? condition
      : `${condition} night`;

    hourly.innerHTML += `
      <div class="hour ${timeClass}">
        <div>${t.toLocaleTimeString([], { hour: "numeric" })}</div>
        <div class="hour-icon">${icon}</div>
        <div class="hour-condition">${conditionText}</div>
        <div>${Math.round(hourlyData.temperature_2m[i])}°</div>
      </div>
    `;
  }

  backButton.disabled = hourlyPageOffset <= 0;
  forwardButton.disabled = endIndex >= hourlyData.time.length;
}

/* HOURLY NAVIGATION */
document.getElementById("hourlyBack").addEventListener("click", () => {
  hourlyPageOffset = Math.max(0, hourlyPageOffset - 12);
  renderHourly();
});

document.getElementById("hourlyForward").addEventListener("click", () => {
  if (hourlyData && hourlyPageOffset + 12 < hourlyData.time.length) {
    hourlyPageOffset += 12;
    renderHourly();
  }
});

/* LOAD WEATHER */
async function loadWeather() {
  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&current=temperature_2m,weather_code` +
    `&hourly=temperature_2m,weather_code,is_day` +
    `&daily=temperature_2m_max,temperature_2m_min,weather_code` +
    `&temperature_unit=fahrenheit&timezone=America%2FDetroit&forecast_days=9`;

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Weather request failed: ${response.status}`);

    const d = await response.json();

    document.getElementById("temp").textContent =
      Math.round(d.current.temperature_2m) + "°";

    document.getElementById("icon").textContent =
      weatherIcon(d.current.weather_code);

    document.getElementById("high").textContent =
      Math.round(d.daily.temperature_2m_max[0]) + "°";

    document.getElementById("low").textContent =
      Math.round(d.daily.temperature_2m_min[0]) + "°";

    /* CURRENT MOON NEXT TO TEMPERATURE */
    document.getElementById("currentMoon").innerHTML =
      getCurrentMoonHTML(new Date());

    hourlyData = d.hourly;
    renderHourly();

    document.getElementById("updated").textContent =
      "Last updated: " +
      new Date().toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });

    const daily = document.getElementById("daily");
    daily.innerHTML = "";

    // Eight forecast days starting tomorrow.
    for (let i = 1; i <= 8; i++) {
      const [year, month, day] = d.daily.time[i].split("-").map(Number);
      const dt = new Date(year, month - 1, day);
      const code = Number(d.daily.weather_code[i]);
      const category = getHourlyWeatherClass(code);

      daily.innerHTML += `
        <div class="day ${category}">
          <div class="day-date">
            ${dt.toLocaleDateString([], {
              weekday: "short",
              month: "numeric",
              day: "numeric"
            })}
          </div>
          <div class="day-icon">${weatherIcon(code)}</div>
          <div class="day-temp">
            ${Math.round(d.daily.temperature_2m_max[i])}° /
            ${Math.round(d.daily.temperature_2m_min[i])}°
          </div>
        </div>
      `;
    }
  } catch (error) {
    console.error("Unable to load weather:", error);
    document.getElementById("updated").textContent = "Weather data unavailable";
  }
}

/* COUNT WORDS */
function wordCount(text) {
  return text
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;
}

async function loadQuote() {
  const quoteText = document.getElementById("quoteText");
  const quoteAuthor = document.getElementById("quoteAuthor");
  const quoteSource = document.getElementById("quoteSource");

  const shuffled = [...quoteSources].sort(() => Math.random() - 0.5);

  for (const source of shuffled) {
    try {
      const response = await fetch(source.url, { cache: "no-store" });
      if (!response.ok) continue;

      const data = await response.json();
      const quote = source.parse(data);

      /* REJECT QUOTES LONGER THAN 25 WORDS */
      if (!quote || !quote.text || wordCount(quote.text) > 25) {
        continue;
      }

      quoteText.textContent = `“${quote.text}”`;
      quoteAuthor.textContent = quote.author ? `— ${quote.author}` : "";
      quoteSource.textContent = source.name;
      return;

    } catch (error) {
      // Try the next quote source.
    }
  }

  /* SHORT FALLBACK */
  quoteText.textContent = "Stay present. Stay kind.";
  quoteAuthor.textContent = "";
  quoteSource.textContent = "";
}
